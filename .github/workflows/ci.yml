name: Task continuity tests

on:
  push:
    branches: [fix/task-context-handoff]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[telegram]' pytest
      - name: Run focused and existing tests
        run: python -m pytest -q
